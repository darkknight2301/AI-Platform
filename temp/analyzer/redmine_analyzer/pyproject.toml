[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmsum"
version = "2.0.1"
description = "Summarise and analyse Redmine tickets with a locally hosted LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",  # .xlsx reports and the Excel audit log
    "pyyaml>=6.0",    # YAML configuration
]

[project.optional-dependencies]
ssh = ["paramiko>=3.4"]  # only needed when Ollama runs on another machine (ssh.enabled)
dev = ["black>=24.0"]

[project.scripts]
rmsum = "rmsum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
